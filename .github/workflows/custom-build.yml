name: 构建已同步的 Bettbox 自定义版

on:
  workflow_dispatch:
    inputs:
      force:
        description: 忽略已有 Release，强制重新构建
        required: false
        default: false
        type: boolean
      target_commit:
        description: 指定需要构建的 custom-build 提交
        required: false
        type: string
      macos_arm64_only:
        description: 只构建并发布 macOS Apple Silicon
        required: false
        default: false
        type: boolean
      android_only:
        description: 只构建并发布 Android arm64-v8a
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: custom-mihomo-${{ inputs.target_commit || github.sha }}
  cancel-in-progress: false

env:
  CUSTOM_MIHOMO_REPOSITORY: uclort/custom-mihomo
  BETTBOX_REQUIRED_FEATURE_BRANCHES: >-
    codex/macos-dns-tun-recovery
    codex/ui-features
    codex/support-inline-provider-content
    codex/custom-in-app-updater
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: 3.44.6
  GO_VERSION: 1.25.x
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false -Dorg.gradle.caching=false
  SENTRY_BACKEND: none

jobs:
  inspect:
    name: 检查源码版本
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.meta.outputs.ready }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      upstream_sha: ${{ steps.meta.outputs.upstream_sha }}
      kernel_sha: ${{ steps.meta.outputs.kernel_sha }}
      app_version: ${{ steps.meta.outputs.app_version }}
      final_app_version: ${{ steps.meta.outputs.final_app_version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      bettbox_release: ${{ steps.meta.outputs.bettbox_release }}
      custom_mihomo_commit: ${{ steps.source.outputs.commit }}
      build_matrix: ${{ steps.matrix.outputs.value }}

    steps:
      - name: 检出 Bettbox 打包分支
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_commit || github.sha }}
          fetch-depth: 0

      - name: 校验自定义功能来源
        shell: bash
        env:
          REQUIRED_FEATURE_BRANCHES: ${{ env.BETTBOX_REQUIRED_FEATURE_BRANCHES }}
        run: |
          set -euo pipefail
          manifest=".custom-build/metadata/feature-branches"
          if [[ ! -s "${manifest}" ]]; then
            echo "缺少自定义功能来源清单：${manifest}" >&2
            exit 1
          fi

          for branch in ${REQUIRED_FEATURE_BRANCHES}; do
            expected="$(awk -F= -v branch="${branch}" '$1 == branch { print $2 }' "${manifest}")"
            if [[ ! "${expected}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "功能分支 ${branch} 缺少有效提交记录。" >&2
              exit 1
            fi
            git fetch --no-tags origin \
              "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            actual="$(git rev-parse "refs/remotes/origin/${branch}")"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "功能分支 ${branch} 已变化，必须先重新同步打包分支。" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "${expected}" HEAD; then
              echo "当前打包提交缺少功能分支 ${branch}@${expected:0:12}。" >&2
              exit 1
            fi
          done

      - name: 读取私有 Mihomo 提交
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(tr -d '[:space:]' < .custom-build/metadata/custom-mihomo-commit)"
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "私有 Mihomo commit 无效：${commit:-未配置}" >&2
            exit 1
          fi
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: 检出私有自定义 Mihomo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CUSTOM_MIHOMO_REPOSITORY }}
          ref: ${{ steps.source.outputs.commit }}
          path: .custom-build/runtime/custom-mihomo
          fetch-depth: 1
          ssh-key: ${{ secrets.CUSTOM_MIHOMO_READ_KEY }}

      - name: 校验自定义内核并生成版本
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          EXPECTED_COMMIT: ${{ inputs.target_commit || '' }}
        run: |
          set -euo pipefail

          if [[ ! -f .custom-build/runtime/custom-mihomo/source/go.mod ]]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            {
              echo "## 暂不构建"
              echo
              echo "私有仓库中尚未检测到 \`source/go.mod\`。"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          module_name="$(
            awk '$1 == "module" { print $2; exit }' \
              .custom-build/runtime/custom-mihomo/source/go.mod
          )"
          if [[ "${module_name}" != "github.com/metacubex/mihomo" ]]; then
            echo "自定义内核模块名错误：${module_name:-未声明}" >&2
            echo "必须为：github.com/metacubex/mihomo" >&2
            exit 1
          fi

          expected_kernel="$(git rev-parse HEAD:core/Clash.Meta)"
          actual_kernel="$(
            tr -d '[:space:]' \
              < .custom-build/runtime/custom-mihomo/source/.bettbox-kernel-tree
          )"
          expected_mihomo="$(
            tr -d '[:space:]' < .custom-build/metadata/mihomo-release
          )"
          actual_mihomo="$(
            tr -d '[:space:]' \
              < .custom-build/runtime/custom-mihomo/source/.upstream-release
          )"
          expected_patch="$(
            sha256sum \
              .custom-build/runtime/custom-mihomo/patches/opensnell-v6.patch \
              | awk '{print $1}'
          )"
          actual_patch="$(
            tr -d '[:space:]' \
              < .custom-build/runtime/custom-mihomo/source/.snell-v6-patch-sha256
          )"
          if [[ "${expected_kernel}" != "${actual_kernel}" ||
                "${expected_mihomo}" != "${actual_mihomo}" ||
                "${expected_patch}" != "${actual_patch}" ]]; then
            echo "custom-mihomo 与当前 Bettbox 打包源码不一致。" >&2
            echo "请先运行 custom-sync.yml，更新内核后再打包。" >&2
            echo "Bettbox 内核树：${expected_kernel} / custom-mihomo：${actual_kernel}" >&2
            echo "Mihomo 版本：${expected_mihomo} / custom-mihomo：${actual_mihomo}" >&2
            echo "OpenSnell 补丁：${expected_patch} / custom-mihomo：${actual_patch}" >&2
            exit 1
          fi

          upstream_sha="$(git rev-parse HEAD)"
          if [[ -n "${EXPECTED_COMMIT}" &&
                "${upstream_sha}" != "${EXPECTED_COMMIT}" ]]; then
            echo "实际检出提交 ${upstream_sha} 与指定提交 ${EXPECTED_COMMIT} 不一致。" >&2
            exit 1
          fi
          kernel_sha="$(
            git -C .custom-build/runtime/custom-mihomo rev-parse HEAD:source
          )"
          app_version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          bettbox_release="$(
            tr -d '[:space:]' < .custom-build/metadata/bettbox-release
          )"

          if [[ -z "${upstream_sha}" ||
                -z "${kernel_sha}" ||
                -z "${app_version}" ||
                -z "${bettbox_release}" ]]; then
            echo "无法读取构建版本信息。" >&2
            exit 1
          fi

          release_identity="${upstream_sha:0:12}-${kernel_sha:0:12}"
          existing_release=""
          while IFS= read -r candidate; do
            if [[ "${candidate}" == *"-${release_identity}" ]]; then
              existing_release="${candidate}"
              break
            fi
          done < <(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[].tag_name'
          )

          if [[ "${FORCE_BUILD}" != "true" && -n "${existing_release}" ]]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            {
              echo "## 无需重复构建"
              echo
              echo "当前 Bettbox 与自定义内核组合已经发布：\`${existing_release}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          build_id="$(date -u +%Y%m%d%H%M%S)"
          build_number="$((2090000000 + GITHUB_RUN_NUMBER))"
          if [[ "${build_number}" -gt 2100000000 ]]; then
            echo "自定义构建编号超过 Android versionCode 上限。" >&2
            exit 1
          fi
          final_app_version="${app_version%%+*}+${build_number}"
          release_tag="custom-v${final_app_version}-r${build_id}-${release_identity}"

          {
            echo "ready=true"
            echo "release_tag=${release_tag}"
            echo "upstream_sha=${upstream_sha}"
            echo "kernel_sha=${kernel_sha}"
            echo "app_version=${app_version}"
            echo "final_app_version=${final_app_version}"
            echo "build_number=${build_number}"
            echo "bettbox_release=${bettbox_release}"
          } >> "${GITHUB_OUTPUT}"

      - name: 选择构建平台
        id: matrix
        shell: bash
        env:
          MACOS_ARM64_ONLY: ${{ inputs.macos_arm64_only || false }}
          ANDROID_ONLY: ${{ inputs.android_only || false }}
        run: |
          set -euo pipefail
          if [[ "${MACOS_ARM64_ONLY}" == "true" && "${ANDROID_ONLY}" == "true" ]]; then
            echo "macos_arm64_only 与 android_only 不能同时启用。" >&2
            exit 1
          elif [[ "${ANDROID_ONLY}" == "true" ]]; then
            include='[{"name":"Android Pixel 6a (arm64-v8a)","platform":"android","arch":"arm64","os":"ubuntu-24.04","artifact":"Bettbox-Android-arm64-v8a"}]'
          elif [[ "${MACOS_ARM64_ONLY}" == "true" ]]; then
            include='[{"name":"macOS Apple Silicon","platform":"macos","arch":"arm64","os":"macos-15","artifact":"Bettbox-macOS-arm64"}]'
          else
            include='[{"name":"Android Pixel 6a (arm64-v8a)","platform":"android","arch":"arm64","os":"ubuntu-24.04","artifact":"Bettbox-Android-arm64-v8a"},{"name":"Windows x64","platform":"windows","arch":"amd64","os":"windows-2022","artifact":"Bettbox-Windows-x64"},{"name":"Windows ARM64","platform":"windows","arch":"arm64","os":"windows-11-arm","artifact":"Bettbox-Windows-arm64"},{"name":"macOS Apple Silicon","platform":"macos","arch":"arm64","os":"macos-15","artifact":"Bettbox-macOS-arm64"},{"name":"macOS Intel","platform":"macos","arch":"amd64","os":"macos-15","artifact":"Bettbox-macOS-amd64"}]'
          fi
          echo "value={\"include\":${include}}" >> "${GITHUB_OUTPUT}"

      - name: 校验 Release 说明
        if: steps.meta.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.meta.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          for file in \
            .custom-build/release-notes/CUSTOM_CHANGES.md \
            .custom-build/release-notes/RELEASE_SUMMARY \
            .custom-build/release-notes/LATEST_CHANGES.md; do
            if [[ ! -s "${file}" ]]; then
              echo "Release 说明缺失或为空：${file}" >&2
              exit 1
            fi
          done

          manifest="android/app/src/main/AndroidManifest.xml"
          file_paths="android/app/src/main/res/xml/file_paths.xml"
          grep -Fq 'android:name="androidx.core.content.FileProvider"' "${manifest}"
          grep -Fq 'android:authorities="${applicationId}.fileProvider"' "${manifest}"
          grep -Fq 'android:resource="@xml/file_paths"' "${manifest}"
          grep -Fq 'path="app_updates/"' "${file_paths}"

          git fetch --force --tags origin
          previous_release="$(
            gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --limit 100 \
              --json tagName,publishedAt \
              --jq 'map(select(.tagName | startswith("custom-v"))) | sort_by(.publishedAt) | reverse | .[0].tagName // ""'
          )"
          if [[ -z "${previous_release}" ]] ||
             ! git rev-parse --verify "${previous_release}^{commit}" >/dev/null 2>&1; then
            exit 0
          fi

          previous_base="$(
            git show \
              "${previous_release}:.custom-build/metadata/bettbox-base-commit" \
              2>/dev/null | tr -d '[:space:]' || true
          )"
          current_base="$(
            tr -d '[:space:]' \
              < .custom-build/metadata/bettbox-base-commit
          )"
          if [[ -z "${previous_base}" ]] ||
             ! git rev-parse --verify "${previous_base}^{commit}" >/dev/null 2>&1; then
            exit 0
          fi

          previous_patch="$(
            git diff --binary "${previous_base}" "${previous_release}" -- \
              . \
              ':(exclude).custom-build/**' \
              ':(exclude).github/workflows/**' |
              git patch-id --stable | awk '{ print $1 }'
          )"
          current_patch="$(
            git diff --binary "${current_base}" "${UPSTREAM_SHA}" -- \
              . \
              ':(exclude).custom-build/**' \
              ':(exclude).github/workflows/**' |
              git patch-id --stable | awk '{ print $1 }'
          )"
          previous_changes="${RUNNER_TEMP}/previous-latest-changes.md"
          git show \
            "${previous_release}:.custom-build/release-notes/LATEST_CHANGES.md" \
            > "${previous_changes}" 2>/dev/null || : > "${previous_changes}"
          if [[ "${previous_patch}" != "${current_patch}" ]]; then
            if cmp -s \
                 "${previous_changes}" \
                 .custom-build/release-notes/LATEST_CHANGES.md; then
              echo "自定义应用代码已变化，但 LATEST_CHANGES.md 未更新。" >&2
              exit 1
            fi
            previous_custom="${RUNNER_TEMP}/previous-custom-changes.md"
            git show \
              "${previous_release}:.custom-build/release-notes/CUSTOM_CHANGES.md" \
              > "${previous_custom}" 2>/dev/null || : > "${previous_custom}"
            if cmp -s \
                 "${previous_custom}" \
                 .custom-build/release-notes/CUSTOM_CHANGES.md; then
              echo "自定义应用代码已变化，但 CUSTOM_CHANGES.md 未更新。" >&2
              exit 1
            fi
          fi

      - name: 显示构建摘要
        if: steps.meta.outputs.ready == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          FINAL_APP_VERSION: ${{ steps.meta.outputs.final_app_version }}
          UPSTREAM_SHA: ${{ steps.meta.outputs.upstream_sha }}
          KERNEL_SHA: ${{ steps.meta.outputs.kernel_sha }}
        run: |
          {
            echo "## 准备并行构建"
            echo
            echo "- Release：\`${RELEASE_TAG}\`"
            echo "- 最终安装版本：\`${FINAL_APP_VERSION}\`"
            echo "- Bettbox custom-build：\`${UPSTREAM_SHA}\`"
            echo "- 自定义 Mihomo 源码树：\`${KERNEL_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: ${{ matrix.name }}
    needs: inspect
    if: needs.inspect.outputs.ready == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inspect.outputs.build_matrix) }}

    env:
      APP_UPDATE_REPOSITORY: uclort/Bettbox
      APP_RELEASE_TAG: ${{ needs.inspect.outputs.release_tag }}
      APP_UPDATE_FEED_URL: ${{ matrix.platform == 'android' && format('https://raw.githubusercontent.com/uclort/Bettbox/custom-update-feed/android-update-{0}.json', matrix.arch) || format('https://raw.githubusercontent.com/uclort/Bettbox/custom-update-feed/appcast-{0}-{1}.xml', matrix.platform, matrix.arch) }}
      CUSTOM_BUILD_NUMBER: ${{ needs.inspect.outputs.build_number }}

    steps:
      - name: 检出 Bettbox 打包分支提交
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.inspect.outputs.upstream_sha }}
          fetch-depth: 1

      - name: 检出私有自定义 Mihomo
        if: matrix.platform != 'windows' || matrix.arch != 'arm64'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CUSTOM_MIHOMO_REPOSITORY }}
          ref: ${{ needs.inspect.outputs.custom_mihomo_commit }}
          path: .custom-build/runtime/custom-mihomo
          fetch-depth: 1
          ssh-key: ${{ secrets.CUSTOM_MIHOMO_READ_KEY }}

      - name: 检出私有自定义 Mihomo（Windows ARM64）
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        env:
          CUSTOM_MIHOMO_READ_KEY: ${{ secrets.CUSTOM_MIHOMO_READ_KEY }}
          CUSTOM_MIHOMO_COMMIT: ${{ needs.inspect.outputs.custom_mihomo_commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $env:CUSTOM_MIHOMO_READ_KEY) {
            throw "缺少 custom-mihomo 只读 SSH 密钥。"
          }

          $checkoutDir = ".custom-build/runtime/custom-mihomo"
          $keyPath = Join-Path $env:RUNNER_TEMP "custom-mihomo-arm64-key"
          New-Item -ItemType Directory -Force (Split-Path $checkoutDir) | Out-Null
          $privateKey = $env:CUSTOM_MIHOMO_READ_KEY.Replace("`r`n", "`n")
          if (-not $privateKey.EndsWith("`n")) {
            $privateKey += "`n"
          }
          [IO.File]::WriteAllText(
            $keyPath,
            $privateKey,
            [Text.UTF8Encoding]::new($false)
          )
          & icacls.exe $keyPath /inheritance:r | Out-Null
          & icacls.exe $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "无法收紧 custom-mihomo SSH 密钥权限。"
          }

          try {
            $env:GIT_SSH_COMMAND = (
              "ssh -i `"$keyPath`" -o IdentitiesOnly=yes " +
              "-o StrictHostKeyChecking=accept-new"
            )
            git init $checkoutDir
            git -C $checkoutDir remote add origin git@github.com:uclort/custom-mihomo.git
            git -C $checkoutDir fetch --depth=1 origin $env:CUSTOM_MIHOMO_COMMIT
            git -C $checkoutDir checkout --detach FETCH_HEAD
          }
          finally {
            Remove-Item $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: 强制替换为自定义 Mihomo
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .custom-build/scripts/use-custom-mihomo.sh
          .custom-build/scripts/use-custom-mihomo.sh \
            . \
            .custom-build/runtime/custom-mihomo/source

      - name: 注入自定义构建编号
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          version_name="${app_version%%+*}"
          temporary_pubspec="${RUNNER_TEMP}/bettbox-pubspec.yaml"
          awk \
            -v version="${version_name}+${CUSTOM_BUILD_NUMBER}" \
            '$1 == "version:" { print "version: " version; next } { print }' \
            pubspec.yaml > "${temporary_pubspec}"
          mv "${temporary_pubspec}" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: 配置 Windows 长路径
        if: matrix.platform == 'windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: 配置 Rust（Android）
        if: matrix.platform == 'android'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: 配置 Rust（Windows）
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}

      - name: 配置 Rust（macOS）
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'amd64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: 配置 Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android Release 签名
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEY_ALIAS \
            ANDROID_STORE_PASSWORD \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "缺少 Android Release 签名 Secret：${secret_name}" >&2
              exit 1
            fi
          done

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" |
            base64 --decode > android/app/keystore.jks
          chmod 600 android/app/keystore.jks
          {
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
            printf 'storePassword=%s\n' "${ANDROID_STORE_PASSWORD}"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}"
          } >> android/local.properties

          keytool -list \
            -keystore android/app/keystore.jks \
            -storepass "${ANDROID_STORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" >/dev/null

      - name: 隔离 Android 临时缓存并检查磁盘
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          gradle_home="${RUNNER_TEMP}/bettbox-gradle"
          pub_cache="${RUNNER_TEMP}/bettbox-pub-cache"
          mkdir -p "${gradle_home}" "${pub_cache}"
          {
            echo "GRADLE_USER_HOME=${gradle_home}"
            echo "PUB_CACHE=${pub_cache}"
            echo "CARGO_INCREMENTAL=0"
          } >> "${GITHUB_ENV}"

          available_kb="$(
            df -Pk "${GITHUB_WORKSPACE}" | awk 'NR == 2 { print $4 }'
          )"
          required_kb=$((10 * 1024 * 1024))
          df -h "${GITHUB_WORKSPACE}"
          if [[ "${available_kb}" -lt "${required_kb}" ]]; then
            echo "Android 构建前可用空间不足 10 GiB，停止构建以避免缓存写满磁盘。" >&2
            exit 1
          fi

      - name: 安装 Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          ndk_version="28.2.13676358"
          set +o pipefail
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;${ndk_version}" >/dev/null
          sdk_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [[ "${sdk_status}" -ne 0 ]]; then
            echo "Android NDK 安装失败，sdkmanager 退出码：${sdk_status}" >&2
            exit "${sdk_status}"
          fi
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${ndk_version}" >> "${GITHUB_ENV}"

      - name: 配置 Android Rust 链接器
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.cargo"
          {
            echo '[target.aarch64-linux-android]'
            echo "linker = \"${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang\""
            echo '[target.armv7-linux-androideabi]'
            echo "linker = \"${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang\""
            echo '[target.x86_64-linux-android]'
            echo "linker = \"${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang\""
            echo '[target.i686-linux-android]'
            echo "linker = \"${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android26-clang\""
          } > "${HOME}/.cargo/config.toml"

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ matrix.platform != 'android' }}
          cache-dependency-path: core/go.sum

      - name: 配置 Flutter
        if: matrix.platform != 'windows' || matrix.arch != 'arm64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-sdk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ runner.arch }}

      - name: 配置 Flutter（Windows ARM64）
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true
          cache-key: flutter-sdk-windows-arm64-master-${{ hashFiles('**/pubspec.lock') }}

      - name: 获取 Flutter 依赖并生成代码
        # Windows ARM64 的 Dart build_runner 在原生镜像上会长时间无输出，
        # 生成文件已随源码提交；该平台跳过重复生成，避免拖满 job 超时。
        if: matrix.platform != 'windows' || matrix.arch != 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run build_runner build -d

      - name: 获取 Flutter 依赖（Windows ARM64）
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          flutter pub get --verbose

      - name: 选择 Windows WinSparkle 架构
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dart windows/packaging/patch_auto_updater_windows.dart \
            --arch=${{ matrix.arch }}

      - name: 回归测试 Windows 桌面网络逻辑
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          flutter test \
            test/common/tray_active_state_test.dart \
            test/controller/macos_tun_startup_test.dart \
            test/manager/proxy_manager_test.dart

      - name: 校验 Windows 安装启动器运行库
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $launcherCmake = Get-Content "windows/packaging/exe/launcher/CMakeLists.txt" -Raw
          if (-not $launcherCmake.Contains('$<$<CONFIG:Release>:/MT>')) {
            throw "Windows 安装启动器未静态链接 MSVC 运行库。"
          }

      - name: 构建 Android arm64-v8a
        if: matrix.platform == 'android'
        shell: bash
        run: dart setup.dart android --arch arm64 --env stable

      - name: 构建 Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arch = "${{ matrix.arch }}"
          dart setup.dart windows --arch $arch --out core-only
          $coreHash = (Get-FileHash libclash/windows/BettboxCore.exe -Algorithm SHA256).Hash.ToLower()
          dart setup.dart windows --arch $arch --out helper --core-hash $coreHash
          flutter build windows --release --verbose `
            --build-number=${{ needs.inspect.outputs.build_number }} `
            --dart-define=CORE_SHA256=$coreHash `
            --dart-define=APP_ENV=stable `
            --dart-define=APP_ASSET_SUFFIX=windows-$arch-setup.exe `
            --dart-define=APP_UPDATE_REPOSITORY=$env:APP_UPDATE_REPOSITORY `
            --dart-define=APP_RELEASE_TAG=$env:APP_RELEASE_TAG `
            --dart-define=APP_UPDATE_FEED_URL=$env:APP_UPDATE_FEED_URL
          dart windows/packaging/exe/package_windows.dart `
            --arch $arch `
            --env stable `
            --temp-safe-launcher

      - name: 校验 Windows 版本与原生架构
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arch = "${{ matrix.arch }}"
          $buildDir = if ($arch -eq "arm64") { "arm64" } else { "x64" }
          $releaseDir = "build/windows/$buildDir/runner/Release"
          $appVersion = "${{ needs.inspect.outputs.app_version }}".Split("+")[0]
          $version = (Get-Item "$releaseDir/Bettbox.exe").VersionInfo.ProductVersion
          $buildNumber = "${{ needs.inspect.outputs.build_number }}"
          if ($version -ne "$appVersion+$buildNumber") {
            throw "Windows ProductVersion 应为 $appVersion+$buildNumber，实际为 $version。"
          }

          function Get-PeMachine {
            param([string]$Path)
            $resolvedPath = (Resolve-Path $Path).Path
            $bytes = [IO.File]::ReadAllBytes($resolvedPath)
            if ($bytes.Length -lt 64) {
              throw "$resolvedPath 不是有效的 PE 文件。"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {
              throw "$resolvedPath 的 PE 头偏移无效。"
            }
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }

          $expectedMachine = if ($arch -eq "arm64") { 0xaa64 } else { 0x8664 }
          $installer = Get-ChildItem "dist/*windows-$arch-setup.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "未找到 Windows $arch 安装程序。"
          }
          $nativeFiles = @(
            "$releaseDir/Bettbox.exe",
            "$releaseDir/BettboxCore.exe",
            "$releaseDir/BettboxHelperService.exe",
            $installer.FullName
          )
          $nativeFiles += Get-ChildItem "$releaseDir/*.dll" |
            ForEach-Object { $_.FullName }
          foreach ($file in $nativeFiles) {
            $machine = Get-PeMachine $file
            if ($machine -ne $expectedMachine) {
              throw (
                "{0} 架构错误：期望 0x{1:x4}，实际 0x{2:x4}。" -f
                $file, $expectedMachine, $machine
              )
            }
          }

      - name: 校验 Windows 更新展示与网络面板入口
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $updaterSource = Get-Content "lib/common/app_updater.dart" -Raw
          foreach ($symbol in @(
            "win_sparkle_set_app_details",
            "win_sparkle_set_app_build_version"
          )) {
            if (-not $updaterSource.Contains($symbol)) {
              throw "Windows 更新器缺少 $symbol。"
            }
          }

          $workflowSource = Get-Content ".github/workflows/custom-build.yml" -Raw
          if (-not $workflowSource.Contains('<title>Bettbox ${FINAL_APP_VERSION}</title>') -or
              -not $workflowSource.Contains(
                '<sparkle:shortVersionString>${FINAL_APP_VERSION}</sparkle:shortVersionString>'
              )) {
            throw "Windows appcast 最新版本展示仍缺少完整构建号。"
          }
          $legacyAppcastLines = $workflowSource -split "`r?`n" | Where-Object {
            $_.Trim().StartsWith('echo "') -and (
              $_.Contains('<title>Bettbox ${short_version}</title>') -or
              $_.Contains('<sparkle:shortVersionString>${short_version}</sparkle:shortVersionString>')
            )
          }
          if ($legacyAppcastLines) {
            throw "Windows appcast 最新版本展示仍使用短版本号。"
          }

          $runnerSource = Get-Content "windows/runner/main.cpp" -Raw
          if (-not $runnerSource.Contains("is_network_panel")) {
            throw "Windows Runner 未识别 --network-panel。"
          }
          if (-not $runnerSource.Contains(
            "const bool activate_existing = !is_control_command && !is_network_panel;"
          )) {
            throw "Windows 网络面板仍会被主窗口单实例逻辑拦截。"
          }
          if (-not $runnerSource.Contains(
            "window.WasExistingWindowActivated() ? EXIT_SUCCESS : EXIT_FAILURE"
          )) {
            throw "Windows 重复启动后未按成功激活已有主窗口退出。"
          }

          $windowSource = Get-Content "windows/runner/win32_window.cpp" -Raw
          foreach ($symbol in @(
            "kMainWindowProperty",
            "FindExistingMainWindow",
            "ActivateExistingWindow"
          )) {
            if (-not $windowSource.Contains($symbol)) {
              throw "Windows 主窗口重复启动激活逻辑缺少 $symbol。"
            }
          }

          $proxySource = Get-Content "plugins/proxy/windows/proxy_plugin.cpp" -Raw
          if (-not $proxySource.Contains("result->Success(startProxy(port, bypassDomain));")) {
            throw "Windows 系统代理未返回真实启用结果。"
          }
          if (-not $proxySource.Contains("void NotifyProxyChanged()") -or
              $proxySource.Contains("&& NotifyProxyChanged()")) {
            throw "Windows 系统代理仍将刷新通知结果作为启停成功条件。"
          }
          if (-not $proxySource.Contains("WriteProxyRegistry") -or
              -not $proxySource.Contains("registry_updated || wininet_updated")) {
            throw "Windows 系统代理缺少注册表写入兜底。"
          }
          $proxyManagerSource = Get-Content "lib/manager/proxy_manager.dart" -Raw
          if (-not $proxyManagerSource.Contains(
                "shouldDeferInitialSystemProxySync"
              ) -or
              -not $proxyManagerSource.Contains("_deferredProxySync")) {
            throw "Windows 启动时仍会先关闭即将启用的系统代理。"
          }

          $systemSource = Get-Content "lib/common/system.dart" -Raw
          if (-not $systemSource.Contains("'start= demand'") -or
              $systemSource.Contains("AppIdentity.isDev ? 'demand' : 'auto'")) {
            throw "Windows Helper 服务未统一配置为按需启动。"
          }
          if (-not $systemSource.Contains("maxAttempts = 60") -or
              -not $systemSource.Contains("startWindowsHelperAndWait") -or
              -not $systemSource.Contains("if (result.exitCode != 0)") -or
              $systemSource.Contains("output.contains('STOPPED')")) {
            throw "Windows Helper 启动失败或首次授权健康等待逻辑不正确。"
          }

          $controllerSource = Get-Content "lib/controller.dart" -Raw
          if (-not $controllerSource.Contains("await windows!.stopHelperService();")) {
            throw "Windows 主程序退出时未停止 Helper 服务。"
          }
          $showWindowIndex = $controllerSource.IndexOf(
            "await _syncInitialWindowVisibility();"
          )
          $initStatusIndex = $controllerSource.IndexOf("await _initStatus();")
          if ($showWindowIndex -lt 0 -or
              $initStatusIndex -lt 0 -or
              $showWindowIndex -ge $initStatusIndex) {
            throw "Windows 窗口展示仍被核心或 TUN 启动流程阻塞。"
          }

          $installerSource = Get-Content "windows/packaging/exe/inno_setup.iss" -Raw
          if (-not $installerSource.Contains("CloseApplicationsFilter={{EXECUTABLE_NAME}}") -or
              $installerSource.Contains("RegisterHelperService") -or
              $installerSource.Contains("'start ' + ServiceName")) {
            throw "Windows 安装器仍会提示或自动启动 Helper 服务。"
          }

      - name: 回归测试 Windows 安装器临时目录回退
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arch = "${{ matrix.arch }}"
          $installer = Get-ChildItem "dist/*windows-$arch-setup.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "未找到 Windows 安装程序。"
          }

          $installDir = Join-Path $env:RUNNER_TEMP "bettbox-installer-smoke-$arch"
          $originalTemp = $env:TEMP
          $originalTmp = $env:TMP
          function Wait-ForInstallerProcess {
            param([Diagnostics.Process]$Process, [string]$Stage, [int]$TimeoutSeconds = 300)
            if (-not $Process.WaitForExit($TimeoutSeconds * 1000)) {
              Get-Process |
                Where-Object {
                  $_.Path -eq $Process.Path -or
                  $_.Path -like "$installDir*" -or
                  $_.Name -like "*Bettbox*"
                } |
                Select-Object Id, ProcessName, Path, StartTime |
                Format-List
              Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
              Get-Process |
                Where-Object {
                  $_.Path -like "$installDir*" -or $_.Name -like "*Bettbox*"
                } |
                Stop-Process -Force -ErrorAction SilentlyContinue
              throw "$Stage 超过 $TimeoutSeconds 秒未退出。"
            }
          }
          try {
            $env:TEMP = "Q:\bettbox-missing-temp"
            $env:TMP = $env:TEMP
            $arguments = @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/NOICONS",
              "/DIR=$installDir"
            )
            $process = Start-Process `
              -FilePath $installer.FullName `
              -ArgumentList $arguments `
              -PassThru
            Wait-ForInstallerProcess -Process $process -Stage "Windows 安装程序"
            if ($process.ExitCode -ne 0) {
              throw "Windows 安装程序退出码异常：$($process.ExitCode)"
            }
            if (-not (Test-Path (Join-Path $installDir "Bettbox.exe"))) {
              throw "Windows 安装程序未写入 Bettbox.exe。"
            }
            $helperProcess = Get-Process "BettboxHelperService" -ErrorAction SilentlyContinue
            if ($helperProcess) {
              throw "静默安装后 Helper 进程不应常驻运行。"
            }
            $helperService = Get-Service "BettboxHelperService" -ErrorAction SilentlyContinue
            if ($helperService -and $helperService.Status -eq "Running") {
              throw "静默安装后 Helper 服务不应处于运行状态。"
            }
          }
          finally {
            $env:TEMP = $originalTemp
            $env:TMP = $originalTmp
            $uninstaller = Join-Path $installDir "unins000.exe"
            if (Test-Path $uninstaller) {
              $uninstallProcess = Start-Process `
                -FilePath $uninstaller `
                -ArgumentList @(
                  "/VERYSILENT",
                  "/SUPPRESSMSGBOXES",
                  "/NORESTART"
                ) `
                -PassThru
              Wait-ForInstallerProcess -Process $uninstallProcess -Stage "Windows 卸载程序"
            }
          }

      - name: 构建 macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: dart setup.dart macos --arch ${{ matrix.arch }} --env stable

      - name: 签署桌面更新包并生成更新元数据
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          WINSPARKLE_DSA_PRIVATE_KEY: ${{ secrets.WINSPARKLE_DSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          metadata="${RUNNER_TEMP}/custom-update-${{ matrix.platform }}-${{ matrix.arch }}.env"
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            if [[ -z "${SPARKLE_ED_PRIVATE_KEY}" ]]; then
              echo "缺少 macOS Sparkle 更新签名 Secret。" >&2
              exit 1
            fi
            package_count="$(find dist -type f -name '*.dmg' | wc -l | tr -d '[:space:]')"
            package="$(find dist -type f -name '*.dmg' -print -quit)"
            if [[ "${package_count}" -ne 1 ]]; then
              echo "预期生成 1 个 macOS DMG，实际为 ${package_count} 个。" >&2
              exit 1
            fi
            signature_output="$(
              printf '%s' "${SPARKLE_ED_PRIVATE_KEY}" |
                macos/Pods/Sparkle/bin/sign_update \
                  --account bettbox-custom \
                  --ed-key-file - \
                  "${package}"
            )"
            signature="$(
              sed -nE 's/.*sparkle:edSignature="([^"]+)".*/\1/p' \
                <<< "${signature_output}"
            )"
            length="$(
              sed -nE 's/.*length="([0-9]+)".*/\1/p' \
                <<< "${signature_output}"
            )"
            signature_type="ed"
          else
            if [[ -z "${WINSPARKLE_DSA_PRIVATE_KEY}" ]]; then
              echo "缺少 Windows WinSparkle 更新签名 Secret。" >&2
              exit 1
            fi
            package_count="$(find dist -type f -name '*setup.exe' | wc -l | tr -d '[:space:]')"
            package="$(find dist -type f -name '*setup.exe' -print -quit)"
            if [[ "${package_count}" -ne 1 ]]; then
              echo "预期生成 1 个 Windows 安装包，实际为 ${package_count} 个。" >&2
              exit 1
            fi
            private_key="${RUNNER_TEMP}/winsparkle-dsa-private.pem"
            printf '%s' "${WINSPARKLE_DSA_PRIVATE_KEY}" > "${private_key}"
            signature="$(
              openssl dgst -sha1 -binary < "${package}" |
                openssl dgst -sha1 -sign "${private_key}" |
                openssl enc -base64 -A
            )"
            rm "${private_key}"
            length="$(wc -c < "${package}" | tr -d '[:space:]')"
            signature_type="dsa"
          fi

          if [[ -z "${signature}" || -z "${length}" ]]; then
            echo "桌面更新包签名结果为空。" >&2
            exit 1
          fi
          {
            echo "platform=${{ matrix.platform }}"
            echo "arch=${{ matrix.arch }}"
            echo "asset=$(basename "${package}")"
            echo "signature_type=${signature_type}"
            echo "signature=${signature}"
            echo "length=${length}"
          } > "${metadata}"

      - name: 上传桌面更新元数据
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: Custom-Update-Metadata-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/custom-update-${{ matrix.platform }}-${{ matrix.arch }}.env
          if-no-files-found: error
          retention-days: 30

      - name: 签署并校验 Android APK
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mapfile -d '' apk_paths < <(
            find dist -type f -name '*.apk' -print0
          )
          if [[ "${#apk_paths[@]}" -ne 1 ]]; then
            echo "预期生成 1 个 Android APK，实际为 ${#apk_paths[@]} 个。" >&2
            exit 1
          fi

          apksigner_path="$(
            find "${ANDROID_SDK_ROOT}/build-tools" \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name apksigner \
              -print |
              sort -V |
              tail -n 1
          )"
          if [[ -z "${apksigner_path}" ]]; then
            echo "Android SDK 中未找到 apksigner。" >&2
            exit 1
          fi

          signed_apk="${RUNNER_TEMP}/$(basename "${apk_paths[0]}")"
          "${apksigner_path}" sign \
            --ks android/app/keystore.jks \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass env:ANDROID_STORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "${signed_apk}" \
            "${apk_paths[0]}"

          signer_report="$(
            "${apksigner_path}" verify \
              --verbose \
              --print-certs \
              "${signed_apk}" 2>&1
          )"
          printf '%s\n' "${signer_report}"
          actual_cert_sha="$(
            sed -nE \
              's/^.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p' \
              <<< "${signer_report}" |
              head -n 1 |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"
          expected_cert_sha="$(
            keytool -exportcert \
              -keystore android/app/keystore.jks \
              -storepass "${ANDROID_STORE_PASSWORD}" \
              -alias "${ANDROID_KEY_ALIAS}" |
              sha256sum |
              awk '{ print $1 }'
          )"

          if [[ -z "${actual_cert_sha}" ||
                "${actual_cert_sha}" != "${expected_cert_sha}" ]]; then
            echo "Android APK 签名证书与固定 Release 证书不一致。" >&2
            echo "实际证书 SHA-256：${actual_cert_sha:-无法读取}" >&2
            echo "预期证书 SHA-256：${expected_cert_sha}" >&2
            exit 1
          fi

          mv "${signed_apk}" "${apk_paths[0]}"

          {
            echo "## Android 固定签名与校验通过"
            echo
            echo "- APK：\`$(basename "${apk_paths[0]}")\`"
            echo "- 证书 SHA-256：\`${actual_cert_sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 检查构建产物
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d dist ]] || [[ -z "$(find dist -type f -print -quit)" ]]; then
            echo "错误：dist 目录中没有构建产物。" >&2
            exit 1
          fi
          find dist -type f -maxdepth 2 -print

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: 清理 Android 临时构建数据
        if: always() && matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          df -h "${GITHUB_WORKSPACE}"
          rm -rf -- \
            "${RUNNER_TEMP}/bettbox-gradle" \
            "${RUNNER_TEMP}/bettbox-pub-cache" \
            "${GITHUB_WORKSPACE}/build" \
            "${GITHUB_WORKSPACE}/.dart_tool" \
            "${GITHUB_WORKSPACE}/android/.gradle"
          df -h "${GITHUB_WORKSPACE}"

  release:
    name: 发布安装包
    needs:
      - inspect
      - build
    if: needs.inspect.outputs.ready == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: 检出 Bettbox 打包分支提交
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.inspect.outputs.upstream_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: 下载所有平台产物
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: Bettbox-*

      - name: 下载桌面更新元数据
        if: ${{ !inputs.android_only }}
        uses: actions/download-artifact@v8
        with:
          path: update-metadata
          pattern: Custom-Update-Metadata-*

      - name: 创建 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.inspect.outputs.release_tag }}
          SOURCE_APP_VERSION: ${{ needs.inspect.outputs.app_version }}
          FINAL_APP_VERSION: ${{ needs.inspect.outputs.final_app_version }}
          BETTBOX_RELEASE: ${{ needs.inspect.outputs.bettbox_release }}
          UPSTREAM_SHA: ${{ needs.inspect.outputs.upstream_sha }}
          MACOS_ARM64_ONLY: ${{ inputs.macos_arm64_only || false }}
          ANDROID_ONLY: ${{ inputs.android_only || false }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find release-assets -type f \
              \( -name '*.apk' -o -name '*.exe' -o -name '*.dmg' \) \
              -print0
          )
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "错误：没有可发布的构建产物。" >&2
            exit 1
          fi
          expected_asset_count=5
          if [[ "${MACOS_ARM64_ONLY}" == "true" ||
                "${ANDROID_ONLY}" == "true" ]]; then
            expected_asset_count=1
          fi
          if [[ "${#assets[@]}" -ne "${expected_asset_count}" ]]; then
            echo "错误：预期发布 ${expected_asset_count} 个安装包，实际为 ${#assets[@]} 个。" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi

          unexpected_assets="$(
            find release-assets -type f \
              ! \( -name '*.apk' -o -name '*.exe' -o -name '*.dmg' \) \
              -print
          )"
          if [[ -n "${unexpected_assets}" ]]; then
            echo "错误：检测到安装包以外的 Release 资产，拒绝发布：" >&2
            printf '%s\n' "${unexpected_assets}" >&2
            exit 1
          fi

          release_summary="$(
            tr -d '\r\n' < .custom-build/release-notes/RELEASE_SUMMARY
          )"
          if [[ -z "${release_summary}" ]]; then
            echo "错误：Bettbox 自定义 Release 精简说明为空。" >&2
            exit 1
          fi

          git fetch --force --tags origin
          previous_release="$(
            gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --limit 100 \
              --json tagName,publishedAt \
              --jq 'map(select(.tagName | startswith("custom-v"))) | sort_by(.publishedAt) | reverse | .[0].tagName // ""'
          )"

          incremental_notes="${RUNNER_TEMP}/incremental-release-notes.md"
          {
            echo "## 本次变更（相较上一自定义 Release）"
            echo
            if [[ -n "${previous_release}" ]] &&
               git rev-parse --verify "${previous_release}^{commit}" >/dev/null 2>&1; then
              previous_upstream="$(
                git show \
                  "${previous_release}:.custom-build/metadata/bettbox-release" \
                  2>/dev/null | tr -d '[:space:]' || true
              )"
              previous_base="$(
                git show \
                  "${previous_release}:.custom-build/metadata/bettbox-base-commit" \
                  2>/dev/null | tr -d '[:space:]' || true
              )"
              current_base="$(
                tr -d '[:space:]' \
                  < .custom-build/metadata/bettbox-base-commit
              )"
              previous_kernel="$(
                git show \
                  "${previous_release}:.custom-build/metadata/custom-mihomo-commit" \
                  2>/dev/null | tr -d '[:space:]' || true
              )"
              current_kernel="$(
                tr -d '[:space:]' \
                  < .custom-build/metadata/custom-mihomo-commit
              )"
              latest_changes=".custom-build/release-notes/LATEST_CHANGES.md"
              previous_changes="${RUNNER_TEMP}/previous-latest-changes.md"
              git show "${previous_release}:${latest_changes}" \
                > "${previous_changes}" 2>/dev/null || : > "${previous_changes}"

              echo "- 对比范围：[\`${previous_release}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${previous_release}) → \`${RELEASE_TAG}\`"
              if [[ -n "${previous_upstream}" &&
                    "${previous_upstream}" != "${BETTBOX_RELEASE}" ]]; then
                echo "- 上游基线：\`${previous_upstream}\` → \`${BETTBOX_RELEASE}\`"
                if [[ -n "${previous_base}" ]] &&
                   git rev-parse --verify "${previous_base}^{commit}" >/dev/null 2>&1; then
                  echo
                  echo "### 上游同步"
                  echo
                  git log \
                    --reverse \
                    --no-merges \
                    --format='- %s (`%h`)' \
                    "${previous_base}..${current_base}"
                fi
              fi
              if [[ -n "${previous_kernel}" &&
                    "${previous_kernel}" != "${current_kernel}" ]]; then
                echo "- 自定义 Mihomo 源码：\`${previous_kernel:0:12}\` → \`${current_kernel:0:12}\`"
              fi

              if ! cmp -s "${previous_changes}" "${latest_changes}"; then
                echo
                cat "${latest_changes}"
              elif [[ "${previous_upstream}" == "${BETTBOX_RELEASE}" &&
                      "${previous_kernel}" == "${current_kernel}" ]]; then
                echo "- 无新的应用或内核功能变更。"
              else
                echo
                echo "### 自定义应用"
                echo
                echo "- 本次无新的自定义应用功能变化。"
              fi
            else
              echo "- 首个自定义 Release。"
            fi
          } > "${incremental_notes}"

          notes_file="${RUNNER_TEMP}/release-notes.md"
          {
            echo "基于上游 Bettbox \`${BETTBOX_RELEASE}\` 构建的自定义版本。"
            echo
            echo "**最终安装版本：\`${FINAL_APP_VERSION}\`**"
            echo
            cat "${incremental_notes}"
            echo
            cat .custom-build/release-notes/CUSTOM_CHANGES.md
            echo
            echo "## 构建信息"
            echo
            echo "- 上游 Bettbox main 基线：\`${BETTBOX_RELEASE}\`"
            echo "- 最终安装版本：\`${FINAL_APP_VERSION}\`"
            echo "- 上游源码版本：\`${SOURCE_APP_VERSION}\`"
            echo "- Bettbox custom-build commit：\`${UPSTREAM_SHA}\`"
            echo
            echo "Release 仅包含本次 Action 生成的安装包，不包含私有自定义 Mihomo 源码。"
            echo
            echo "Windows 与 macOS 安装包未做商业代码签名；Android 安装包使用 Bettbox 自定义版固定 Release 签名。"
          } > "${notes_file}"

          if ! git ls-remote --exit-code --tags origin \
            "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag "${RELEASE_TAG}" "${UPSTREAM_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Bettbox ${FINAL_APP_VERSION} · ${BETTBOX_RELEASE} · ${release_summary}" \
            --notes-file "${notes_file}"

      - name: 更新应用内更新源
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.inspect.outputs.release_tag }}
          APP_VERSION: ${{ needs.inspect.outputs.app_version }}
          FINAL_APP_VERSION: ${{ needs.inspect.outputs.final_app_version }}
          BUILD_NUMBER: ${{ needs.inspect.outputs.build_number }}
          UPSTREAM_SHA: ${{ needs.inspect.outputs.upstream_sha }}
          FEED_BRANCH: custom-update-feed
          MACOS_ARM64_ONLY: ${{ inputs.macos_arm64_only || false }}
          ANDROID_ONLY: ${{ inputs.android_only || false }}
        run: |
          set -euo pipefail

          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          published_at="$(date -Ru)"
          export published_at
          feed_source="${RUNNER_TEMP}/custom-update-feed"
          mkdir -p "${feed_source}"

          generate_feed() {
            local platform="$1"
            local arch="$2"
            local metadata
            metadata="$(
              find update-metadata -type f \
                -name "custom-update-${platform}-${arch}.env" \
                -print -quit
            )"
            if [[ -z "${metadata}" ]]; then
              echo "缺少 ${platform}-${arch} 更新元数据。" >&2
              exit 1
            fi

            local asset signature signature_type length signature_attribute
            asset="$(sed -n 's/^asset=//p' "${metadata}")"
            signature="$(sed -n 's/^signature=//p' "${metadata}")"
            signature_type="$(sed -n 's/^signature_type=//p' "${metadata}")"
            length="$(sed -n 's/^length=//p' "${metadata}")"
            if [[ -z "${asset}" || -z "${signature}" || -z "${length}" ]]; then
              echo "${platform}-${arch} 更新元数据不完整。" >&2
              exit 1
            fi

            if [[ "${signature_type}" == "ed" ]]; then
              signature_attribute="sparkle:edSignature=\"${signature}\""
            elif [[ "${signature_type}" == "dsa" ]]; then
              signature_attribute="sparkle:dsaSignature=\"${signature}\""
            else
              echo "未知更新签名类型：${signature_type}" >&2
              exit 1
            fi

            local asset_url feed_file
            asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}"
            feed_file="${feed_source}/appcast-${platform}-${arch}.xml"
            {
              echo '<?xml version="1.0" encoding="utf-8"?>'
              echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
              echo '  <channel>'
              echo "    <title>Bettbox ${platform}-${arch} 自定义更新</title>"
              echo "    <link>https://github.com/${GITHUB_REPOSITORY}/releases</link>"
              echo '    <description>Bettbox 自定义版本更新源</description>'
              echo '    <language>zh-CN</language>'
              echo '    <item>'
              echo "      <title>Bettbox ${FINAL_APP_VERSION}</title>"
              echo "      <pubDate>${published_at}</pubDate>"
              echo "      <link>${release_url}</link>"
              echo "      <sparkle:releaseNotesLink>${release_url}</sparkle:releaseNotesLink>"
              echo "      <sparkle:version>${BUILD_NUMBER}</sparkle:version>"
              echo "      <sparkle:shortVersionString>${FINAL_APP_VERSION}</sparkle:shortVersionString>"
              echo "      <enclosure url=\"${asset_url}\" length=\"${length}\" type=\"application/octet-stream\" sparkle:os=\"${platform}\" ${signature_attribute} />"
              echo '    </item>'
              echo '  </channel>'
              echo '</rss>'
            } > "${feed_file}"
          }

          if [[ "${ANDROID_ONLY}" != "true" ]]; then
            generate_feed macos arm64
            if [[ "${MACOS_ARM64_ONLY}" != "true" ]]; then
              generate_feed macos amd64
              generate_feed windows amd64
              generate_feed windows arm64
            fi
          fi

          if [[ "${MACOS_ARM64_ONLY}" != "true" ]]; then
            android_asset_path="$(find release-assets -type f -name '*.apk' -print -quit)"
            if [[ -z "${android_asset_path}" ]]; then
              echo "缺少 Android APK，无法生成 Android 更新源。" >&2
              exit 1
            fi
            android_asset="$(basename "${android_asset_path}")"
            android_sha256="$(sha256sum "${android_asset_path}" | awk '{ print $1 }')"
            android_length="$(wc -c < "${android_asset_path}" | tr -d '[:space:]')"
            release_summary="$(tr -d '\r\n' < .custom-build/release-notes/RELEASE_SUMMARY)"
            export ANDROID_ASSET="${android_asset}"
            export ANDROID_LENGTH="${android_length}"
            export ANDROID_SHA256="${android_sha256}"
            export RELEASE_SUMMARY="${release_summary}"
            python3 - "${feed_source}/android-update-arm64.json" <<'PY'
          import json
          import os
          import sys
          from urllib.parse import quote

          repository = os.environ['GITHUB_REPOSITORY']
          release_tag = os.environ['RELEASE_TAG']
          asset = os.environ['ANDROID_ASSET']
          release_url = f'https://github.com/{repository}/releases/tag/{quote(release_tag, safe="")}'
          asset_url = f'https://github.com/{repository}/releases/download/{quote(release_tag, safe="")}/{quote(asset, safe="")}'
          payload = {
              'tag_name': release_tag,
              'name': f"Bettbox {os.environ['FINAL_APP_VERSION']}",
              'html_url': release_url,
              'published_at': os.environ['published_at'],
              'body': os.environ['RELEASE_SUMMARY'],
              'draft': False,
              'prerelease': False,
              'assets': [{
                  'name': asset,
                  'size': int(os.environ['ANDROID_LENGTH']),
                  'digest': f"sha256:{os.environ['ANDROID_SHA256']}",
                  'browser_download_url': asset_url,
              }],
          }
          with open(sys.argv[1], 'w', encoding='utf-8') as file:
              json.dump(payload, file, ensure_ascii=False, separators=(',', ':'))
              file.write('\n')
          PY
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          feed_worktree="${RUNNER_TEMP}/custom-update-feed-worktree"
          if git ls-remote --exit-code --heads origin \
            "refs/heads/${FEED_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${FEED_BRANCH}"
            git worktree add --detach "${feed_worktree}" FETCH_HEAD
          else
            git worktree add --detach "${feed_worktree}" "${UPSTREAM_SHA}"
          fi
          cp "${feed_source}"/* "${feed_worktree}/"
          git -C "${feed_worktree}" add -- .
          if ! git -C "${feed_worktree}" diff --cached --quiet; then
            git -C "${feed_worktree}" commit -m "chore: update appcast for ${RELEASE_TAG} [skip ci]"
            git -C "${feed_worktree}" push origin "HEAD:${FEED_BRANCH}"
          fi

      - name: 写入发布摘要
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.inspect.outputs.release_tag }}
        run: |
          {
            echo "## 构建已发布"
            echo
            echo "Release：\`${RELEASE_TAG}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
